  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263342" x="69.12" y="306.936" transform="rotate(-0 69.12 306.936)">Selected and last fitted models are shown separately so early checkpoint selection does not hide training variability.</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263342" x="69.12" y="326.34" transform="rotate(-0 69.12 326.34)">True Bayes bias and irreducible label noise are unknown. Initialization and validation are fixed; training meaning families are resampled.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263342" x="69.12" y="345.744" transform="rotate(-0 69.12 345.744)">These logistic pair-order scores are not calibrated image-suitability probabilities; the test set is a reused semantic regression fixture.</text>
  </g>
